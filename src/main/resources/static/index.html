<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API de Clientes</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: rgb(134, 175, 94);
        font-family: Arial, sans-serif;
        text-align: center;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      main {
        flex: 1;
        /* Faz o conteúdo principal crescer e empurrar o rodapé */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      a {
        font-size: 1.2em;
        text-decoration: none;
        color: #fff;
        background-color: #337ab7;
        padding: 10px 20px;
        border-radius: 5px;
      }

      footer {
        padding: 20px 0;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Bem-vindo à API de Clientes</h1>
      <p>
        Esta é uma API REST para gerenciamento de clientes com integração com o
        ViaCEP.
      </p>
      <p>
        Para interagir com os endpoints, acesse a documentação do Swagger UI:
      </p>
      <a href="/swagger-ui.html">Acessar Swagger UI</a>
    </main>
    <footer>
      <p>&copy; 2025 API VIACEP - Pedro Zeferino da Silva.</p>
    </footer>
  </body>
</html>
